name: crypto

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/common/crypto/**'
      - 'packages/block/**'
      - 'packages/chain/**'
      - 'packages/converter/**'
      - 'packages/transaction/**'
      - 'packages/types/**'
      - 'packages/smart/**'
      - 'tools/cryptovectors/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/crypto.yml'

jobs:
  test:
    strategy:
      matrix:
        # the minimum go.mod allows, and the current release
        go: ['1.27', 'stable']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Sign and verify under every suite
        run: go test -count=1 ./packages/common/crypto/...
      - name: Golden vectors match what the node computes
        run: go test -count=1 ./tools/cryptovectors/...

  # FIPS 140-3 mode: built against a frozen Go Cryptographic Module, run with fips140=only so that
  # any non-approved primitive fails. v1.0.0 is the certified module (no ML-DSA); v1.26.0 adds ML-DSA.
  fips:
    strategy:
      matrix:
        module: ['v1.0.0-c2097c7c', 'v1.26.0']
    runs-on: ubuntu-latest
    env:
      GOFIPS140: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build the node against the module
        run: go build ./...
      - name: Approved suites run, others are refused, genesis and TLS checks hold
        env:
          GODEBUG: fips140=only
        run: go test -count=1 -run 'FIPS|Algos|Genesis|TLS|PIV|RSA' -v ./packages/common/crypto/ ./packages/block/ ./packages/chain/ ./packages/conf/syspar/
